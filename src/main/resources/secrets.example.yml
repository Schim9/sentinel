sentinel:
  # URL publique de l'instance (utilisée dans les liens Pushbullet)
  public-base-url: https://sentinel.yourdomain.com

  # Liste complète des Pi supervisés (remplace entièrement celle de application.yml)
  hosts:
    - name: pi-1
      model: pi3
      ip: 192.168.1.10
    - name: pi-2
      model: pi5
      ip: 192.168.1.11
      thresholds:
        cpu-temp-warn: 75.0
        cpu-temp-crit: 85.0

  # Liste complète des applications à checker (remplace entièrement celle de application.yml)
  apps:
    - name: my-app
      host: pi-1
      internal-url: http://192.168.1.10:8080/api/status
      external-url: https://my-app.yourdomain.com/api/status
      parse-status-body: true
    # Exemple avec vérification du corps de réponse :
    # - name: domoticz
    #   host: pi-1
    #   internal-url: http://192.168.1.10:8080/json.htm?type=command&param=getversion
    #   external-url: https://domoticz.yourdomain.com/json.htm?type=command&param=getversion
    #   expect-body-contains: '"status" : "OK"'

  # Secret pour le bouton de refresh manuel sur /report
  refresh-token: <REFRESH_SECRET_CHANGE_ME>

  # Tokens d'authentification des agents (un par Pi, valeur libre mais unique et aléatoire)
  host-tokens:
    pi-1: <SECRET_CHANGE_ME>
    pi-2: <SECRET_CHANGE_ME>

  pushbullet:
    access-token: <PUSHBULLET_ACCESS_TOKEN>
    device-iden:   # optionnel — laisser vide pour tous les appareils

  mail:
    from: sentinel@yourdomain.com
    to: you@yourdomain.com

spring:
  datasource:
    url: jdbc:sqlite:/opt/sentinel/data/sentinel.db

  mail:
    host: smtp.yourdomain.com
    port: 465
    username: sentinel@yourdomain.com
    password: <SMTP_PASSWORD>
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
