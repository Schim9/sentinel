spring:
  config:
    import: ""
  datasource:
    url: jdbc:sqlite:file::memory:?cache=shared
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  mail:
    host: localhost
    port: 3025
    username: test
    password: test
  threads:
    virtual:
      enabled: true

server:
  port: 8090
  forward-headers-strategy: native

sentinel:
  public-port: 8091
  public-base-url: http://localhost:8091
  timezone: Europe/Paris
  refresh-token: "test-refresh-token"
  refresh-min-interval: PT10M
  hosts:
    - name: pi-domoticz
      model: pi3
      ip: 192.168.1.1
    - name: pi-backend-1
      model: pi3
      ip: 192.168.1.2
    - name: pi-backend-2
      model: pi3
      ip: 192.168.1.3
    - name: pi-backend-3
      model: pi5
      ip: 192.168.1.4
  apps:
    - name: test-app
      host: pi-backend-1
      internal-url: http://192.168.1.2:8080/status
  thresholds:
    cpu-temp-warn: 70.0
    cpu-temp-crit: 80.0
    disk-warn-pct: 80
    disk-crit-pct: 90
    mem-available-warn-pct: 15.0
    mem-available-crit-pct: 5.0
    swap-used-warn-pct: 50
    swap-used-crit-pct: 85
    load-warn-per-core: 2.0
    load-crit-per-core: 4.0
    cert-warn-days: 14
    cert-crit-days: 3
  evaluation:
    report-interval: PT30M
    silence-threshold: PT2H
    startup-grace: PT30M
    breach-count: 2
    recovery-count: 2
    app-check-interval: PT30M
    app-check-timeout: PT5S
    app-breach-count: 2
  notifications:
    crit-reminder-interval: PT24H
    quiet-hours:
      enabled: false
    grouping-window: PT1S
  digest:
    time: "08:00"
    token-validity: PT168H
    ack-timeout: PT36H
    escalation-interval: PT24H
  weekly-report:
    cron: "0 0 8 * * MON"
  retention:
    raw: P30D
    history: P365D
  host-tokens:
    pi-domoticz: test-token-pi-domoticz
    pi-backend-1: test-token-pi-backend-1
    pi-backend-2: test-token-pi-backend-2
    pi-backend-3: test-token-pi-backend-3
  pushbullet:
    access-token: "test-pushbullet-token"
  mail:
    from: test@sentinel.local
    to: test@sentinel.local

management:
  endpoints:
    web:
      exposure:
        include: health,info
  server:
    port: 8090
